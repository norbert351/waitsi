# WAITSI — long-running SSE backend + wait-surface (single service).
# Render web service (not serverless) because the surface drives a live
# 1-second SSE stream that must stay connected indefinitely.
services:
  - type: web
    name: waitsi
    runtime: node
    plan: free
    buildCommand: "npm ci --omit=dev"
    startCommand: npm run seed && npm start
    envVars:
      - key: HOST
        value: 0.0.0.0
      # PORT is injected automatically by Render.
      # Neon Postgres connection string — the secret's VALUE is set in the
      # Render dashboard (sync: false keeps it out of the repo). Without this
      # the service boots straight into db.js's "No database configured" throw.
      - key: WAITSI_DATABASE_URL
        sync: false
      # Namespace every table into the `waitsi` schema. This Neon DB is SHARED:
      # its `public.users` belongs to another app (id uuid + wallet_address), so
      # unqualified DDL collides — "foreign key worlds_user_id_fkey cannot be
      # implemented: integer and uuid". Setting this makes db.js emit
      # waitsi.users / waitsi.worlds / … and sidesteps public entirely.
      - key: WAITSI_DB_SCHEMA
        value: waitsi